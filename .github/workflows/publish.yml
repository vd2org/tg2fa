name: Publish container image

on:
  push:
    branches:
      - main
    tags:
      - "**"

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve image metadata
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.vars.outputs.image }}
      final_tag: ${{ steps.vars.outputs.final_tag }}
    steps:
      - name: Resolve registry image and release tag
        id: vars
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            final_tag="${GITHUB_REF_NAME}"
          else
            final_tag="testing"
          fi

          if [[ ! "${final_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Unsupported container tag: ${final_tag}" >&2
            exit 1
          fi

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "final_tag=${final_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and push ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=tg2fa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=tg2fa-${{ matrix.arch }}
          push: true
          tags: ${{ needs.prepare.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}

  publish:
    name: Publish multi-arch image
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      FINAL_TAG: ${{ needs.prepare.outputs.final_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Combine per-architecture images
        shell: bash
        run: |
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}-amd64"
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:${FINAL_TAG}" \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${FINAL_TAG}"
