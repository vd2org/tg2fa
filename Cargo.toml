[package]
name = "tg2fa"
version = "0.1.0"
edition = "2021"
build = "build.rs"

license = "MIT OR Apache-2.0"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
fred = "10.1.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
log = "0.4.33"
fern = { version = "0.7.1", features = ["chrono", "colored"] }
chrono = "0.4.45"
tokio-util = "0.7.18"
shadow-rs = { version = "2.0.0", default-features = false }
maxminddb = { version = "0.29.0", features = ["mmap"] }
url = "2.5.8"
clap = { version = "4.6.1", features = ["derive", "env"] }
humantime = "2.4.0"
constant_time_eq = "0.5.0"
tgrs = { path = "crates/tgrs" }
minijinja = { version = "2.21.0" }

[build-dependencies]
shadow-rs = "2.0.0"
